spring:
  application:
    name: ${SPRING_APPLICATION_NAME:booking-service}

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/booking_db?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Hoangduc2006}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:true}
        dialect: org.hibernate.dialect.MySQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: ${KAFKA_PRODUCER_ACKS:all}
      retries: ${KAFKA_PRODUCER_RETRIES:3}
      properties:
        enable.idempotence: ${KAFKA_PRODUCER_IDEMPOTENCE:true}

server:
  port: ${SERVER_PORT:8082}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: ${EUREKA_REGISTER:true}
    fetch-registry: ${EUREKA_FETCH_REGISTRY:true}
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:true}
    instance-id: ${spring.application.name}:${HOSTNAME:localhost}:${server.port}

# ── Resilience4j Circuit Breaker ──────────────────────────────────────────────
resilience4j:
  circuitbreaker:
    instances:
      movieService:
        # Tỷ lệ lỗi (%) vượt ngưỡng sẽ mở circuit
        failure-rate-threshold: ${CB_FAILURE_RATE:50}
        # Số lần gọi tối thiểu trong cửa sổ để tính failure rate
        minimum-number-of-calls: ${CB_MIN_CALLS:5}
        # Kích thước cửa sổ trượt (số lần gọi)
        sliding-window-size: ${CB_WINDOW_SIZE:10}
        sliding-window-type: COUNT_BASED
        # Thời gian (s) circuit ở trạng thái OPEN trước khi thử HALF_OPEN
        wait-duration-in-open-state: ${CB_WAIT_DURATION:10s}
        # Số lần gọi thử trong trạng thái HALF_OPEN
        permitted-number-of-calls-in-half-open-state: ${CB_HALF_OPEN_CALLS:3}
        # Tự động chuyển sang HALF_OPEN sau thời gian chờ
        automatic-transition-from-open-to-half-open-enabled: true
        # Không tính MovieNotFoundException là lỗi (phim không tồn tại là lỗi nghiệp vụ bình thường)
        ignore-exceptions:
          - org.example.bookingservice.exceptions.MovieNotFoundException
        record-exceptions:
          - org.example.bookingservice.exceptions.MovieServiceException
          - feign.FeignException

# ── Booking Kafka Topics ───────────────────────────────────────────────────────
booking:
  kafka:
    booking-created-topic: ${BOOKING_CREATED_TOPIC:booking-created}
